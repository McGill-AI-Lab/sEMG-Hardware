; =============================================================================
;  PlatformIO project file for the ADS1298 clamshell validation firmware
; =============================================================================
;
;  WHAT THIS FILE IS
;  -----------------
;  PlatformIO reads this file to know *what* to build and *how* to upload it.
;  Each [env:...] block is one "build environment" (a board + framework +
;  options). We only need one.
;
;  HOW TO USE IT
;  -------------
;  From this folder (Clamshell Testing/firmware):
;      pio run -t upload          -> compile and flash the ESP32-S3
;  or press the "Upload" arrow in the VS Code PlatformIO toolbar.
;
;  You only flash this firmware ONCE. After that, every experiment is driven
;  from the PC by host/run_suite.py, which sends text commands over USB.
;
;  Lines starting with ';' are comments in this file format (INI).
; =============================================================================

[env:clamshell-suite]
platform = espressif32                 ; the Espressif ESP32 platform (compiler, upload tool)
board = esp32-s3-devkitc-1             ; the exact dev board: tells PlatformIO the chip, flash size, pin map
framework = arduino                    ; use the Arduino API (setup(), loop(), digitalWrite(), SPI, Serial...)

monitor_speed = 2000000                ; baud rate for the serial monitor. MUST match SERIAL_BAUD in src/main.cpp
upload_speed = 921600                  ; how fast the firmware image is flashed (unrelated to monitor_speed)

build_flags =
    -DCORE_DEBUG_LEVEL=0               ; silence ESP32 core log messages so they don't mix into our binary data stream
